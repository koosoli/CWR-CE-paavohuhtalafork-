    The AI assistant that authors the changes is deliberately not recorded as a
    reviewer. It is the author, so it cannot also be the independent check, and
    naming it as one would assert a scrutiny that did not happen.

    Read every VALIDATED Preview-0 ticket accordingly: it means the owner
    verified it, not that a second party did.
