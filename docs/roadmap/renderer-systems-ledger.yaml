schema_version: 1
purpose: >-
  Register of renderer systems that already ship on the integration branch.

  RND-030 recommendation 3: the shipped renderer systems had no ticket, no owner and
  no evidence record, so nothing could be assigned against them and nothing could be
  checked. That gates overlapping renderer work — you cannot safely start a system
  without knowing whether it already exists under another name.

  This is deliberately NOT in docs/roadmap/status-ledger.yaml. That file is the
  Preview-0 execution ledger and its validator requires
  authorised_tickets == execution_queue == ledger ids, so adding these entries would
  assert they are Preview-0 scope. They are not; they predate it.

  Validated by scripts/validate_renderer_ledger.py, which re-checks every recorded
  call site against the branch. That check is the point of the file: RND-030's own
  matrix recorded a plan as shipped on the strength of a symbol that was actually
  evidence against it, and a hand-maintained table with no verification will drift
  the same way again.

status_values:
  SHIPPED: The plan's scope is present in the branch.
  PARTIAL: Some of it is present. `completeness` says what is missing.
  SHIPPED_DISABLED: Present and complete, but off by default at runtime.

verification_note: >-
  `production_call_sites` are verified mechanically by the validator: the file must
  be tracked and must contain the symbol. That proves the system EXISTS, which is a
  weaker claim than the plan having landed — exactly the distinction RND-030 got
  wrong for the shadow plan.

  `completeness` is a judgement, not a mechanical check. Entries marked
  `audited: 2026-08-03` were re-checked item by item against the branch in this pass.
  Entries marked `audited: null` carry their stage-level claim from the RND-030
  report and have NOT been re-verified beyond the anchor below. Treat those as
  "exists, extent unconfirmed".

