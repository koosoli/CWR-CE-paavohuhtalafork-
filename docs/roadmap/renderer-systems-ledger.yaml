    completeness: >-
      Tier 1 is two of four. Landed: shadow distance decoupled from the 250 m clamp
      (Engine.hpp shadowDistance, 400 m default) and splitCoef/distanceCoef exposed in
      the dev overlay. Not landed: MAX_CASCADES 4 -> 8 at 2048 (still 4, and the dev
      slider is capped at 4), and the closed-vs-single-sided caster split with
      front-face culling. Tiers 2 and 3 not audited.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/gfx3d/mod.rs
        symbol: MAX_CASCADES
      - file: engine/WgpuRenderer/rust/src/lib.rs
        symbol: wgr_shadow_cascades

