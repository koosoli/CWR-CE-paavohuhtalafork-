  - id: RSYS-DEPTH-PREPASS
    title: Opaque depth and normal prepass, Hi-Z
    plan: engine/WgpuRenderer/docs/depth-prepass-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-03
    completeness: >-
      Stage-by-stage against the branch, which does NOT match the plan's status line
      ("Stages 0/2/3 still planned"):

      Stage 0 — NOT done. No overdraw heatmap anywhere in the tree. GPU timer regions
      exist but none brackets the opaque colour segment; the nearest is GrassPrepass.

      Stage 1 — DONE and ON by default. prepass_enabled defaults true (lib.rs);
      WGR_PREPASS=0 is a dev A/B only, and unlike several other WGR_* switches it is
      not overwritten by ConfigureWgpuUltraEnvironment. shaders/gbuffer.wgsl carries
      the octahedral encode into NORMAL_FORMAT = Rg16Float.

      Stage 2 — DONE, contrary to the plan. The depth target has TEXTURE_BINDING and
      a depth-aspect view; normal_view() is exposed and bound; both named consumers
      landed — water takes water_depth_view via set_depth_view, and Hi-Z takes the
      nearest resolve.

      Stage 3 — one item of three. Foliage cutout uses alpha-to-coverage in BOTH the
      colour and prepass pipelines (foliage_a2c drives alpha_to_coverage_enabled at
      two cull.rs sites), which was the MSAA item. No evidence of the prepass replay
      being folded into the indirect path, nor of extra depth segments.

      So SSAO's stated prerequisite is already met: the normal G-buffer is populated
      including foliage and is exposed. The plan's remark that "nothing samples it
      yet" is still true — no consumer exists — but that is a missing consumer, not a
      missing producer.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/gfx3d/hiz.rs
        symbol: pub fn build
      - file: engine/WgpuRenderer/rust/src/gfx3d/cull.wgsl
        symbol: hiz

  - id: RSYS-GPU-CULL
    title: GPU-driven culling
    plan: engine/WgpuRenderer/docs/gpu-culling-and-depth-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-03
    completeness: >-
      "Stages 1-3 live" (the RND-030 summary) overstates stage 3. The plan's own status
      block is the accurate one:

      Stage 1 retained data model — built, folded into CullState rather than as the
      doc's CPU-draw intermediary. Stage 2 CPU-built indirect — done, default-on where
      the adapter offers INDIRECT_FIRST_INSTANCE (WGR_INDIRECT=0 forces the direct
      path). Stage 4 Hi-Z occlusion — done.

      Stage 3 GPU cull + LOD compute is Rust-side only and INERT: gpu_driven_enabled
      defaults true, but nothing happens until C++ registers a retained scene, and that
      feed (stage 3b-3) is not built. The renderer logs "GPU-driven rendering enabled
      (WGR_GPU_DRIVEN); inert until a scene registers" — so the headline win is not
      observable yet, whatever the flag says.

      Stages 5 (multi-view) and 6 (skinned + transparent) are not started. Stage 6 is
      where RSYS-SKIN-BAKE is meant to be re-enabled; the bake is deliberately off
      until then because standalone it is pure overhead.

      Audit note: the C++ and Rust gates disagreed on parsing. Rust enables on any
      value that is not "0"; C++ required exactly "1", despite a comment asserting they
      mirrored exactly. WGR_GPU_DRIVEN=true therefore enabled the Rust path and left
      C++ off, silently inert with an "enabled" log line. Fixed by matching the parse;
      the differing DEFAULT is intentional and was left alone.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/gfx3d/cull.rs
        symbol: fn frustum_planes
      - file: engine/WgpuRenderer/rust/src/gfx3d/cull.wgsl
        symbol: workgroup_size

