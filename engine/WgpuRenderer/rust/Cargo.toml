[package]
name = "wgpu_renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.87" # wgpu 29 MSRV
description = "WGPU graphics backend for Cold War Assault (Rust side of the C ABI)"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# naga-ir: lets us hand wgpu a pre-composed naga::Module (ShaderSource::Naga),
# which is how the naga_oil-composed shaders are fed in (see src/shaders/).
wgpu = { version = "29.0", features = ["naga-ir"] }
# Shader module system (#import / #define_import_path). 0.22 tracks naga 29, the
# same naga wgpu 29 pins, so the naga crate unifies to one version.
naga_oil = "0.22"
# Direct handle on naga (the version above pulls it in) so we can hand the
# composer the validation capabilities our shaders need (binding arrays).
naga = "29"
# must match the version wgpu re-exports
raw-window-handle = "0.6"
pollster = "0.4"
slotmap = "1.0"
bytemuck = "1.25.0"
glam = { version = "0.33.2", features = ["bytemuck"] }
# Fast, non-DoS-resistant hasher (FxHashMap) for hot per-frame maps — the draw
# instancing plan's BucketKey coalesce, the shadow-caster bucketing, and the
# pipeline-variant cache. Default SipHash dominated plan_3d (~260ms/frame in
# profiling); keys are small and engine-authored, so the fast hasher is the right
# trade. Already in the lock via wgpu, so this adds no new download.
rustc-hash = "2"
